<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Отделы</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">
                <i class="fas fa-building"></i> Отделы
            </h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/departments/create" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Добавить отдел
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="row">
                    <div class="col-md-6">
                        <h5 class="card-title mb-0">Список отделов</h5>
                    </div>
                    <div class="col-md-6 text-end">
                        <a href="/departments/search" class="btn btn-outline-secondary">
                            <i class="fas fa-search"></i> Поиск
                        </a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Код</th>
                                <th>Описание</th>
                                <th>Бюджет</th>
                                <th>Сотрудники</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="department : ${departments}">
                                <td th:text="${department.id}"></td>
                                <td th:text="${department.name}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${department.code}"></span>
                                </td>
                                <td>
                                    <span th:text="${#strings.abbreviate(department.description, 50)}"></span>
                                </td>
                                <td th:text="${department.budget != null ? #numbers.formatCurrency(department.budget) : 'Не указан'}"></td>
                                <td>
                                    <span class="badge bg-info" th:text="${department.employeeCount != null ? department.employeeCount : 0}"></span>
                                </td>
                                <td>
                                    <span th:if="${department.isActive}" class="badge bg-success">Активен</span>
                                    <span th:unless="${department.isActive}" class="badge bg-danger">Неактивен</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/departments/{id}(id=${department.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/departments/{id}/edit(id=${department.id})}" 
                                           class="btn btn-sm btn-outline-warning">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/departments/{id}/delete(id=${department.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              onsubmit="return confirm('Вы уверены, что хотите удалить этот отдел?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
