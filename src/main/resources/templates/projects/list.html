<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Проекты</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">
                <i class="fas fa-project-diagram"></i> Проекты
            </h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/projects/create" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Добавить проект
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="row">
                    <div class="col-md-6">
                        <h5 class="card-title mb-0">Список проектов</h5>
                    </div>
                    <div class="col-md-6 text-end">
                        <a href="/projects/search" class="btn btn-outline-secondary">
                            <i class="fas fa-search"></i> Поиск
                        </a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Описание</th>
                                <th>Дата начала</th>
                                <th>Дата окончания</th>
                                <th>Прогресс</th>
                                <th>Статус</th>
                                <th>Приоритет</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="project : ${projects}">
                                <td th:text="${project.id}"></td>
                                <td th:text="${project.name}"></td>
                                <td>
                                    <span th:text="${#strings.abbreviate(project.description, 50)}"></span>
                                </td>
                                <td th:text="${#temporals.format(project.startDate, 'dd.MM.yyyy')}"></td>
                                <td th:text="${project.endDate != null ? #temporals.format(project.endDate, 'dd.MM.yyyy') : 'Не указана'}"></td>
                                <td>
                                    <div class="progress" style="width: 100px;">
                                        <div class="progress-bar" 
                                             th:style="'width: ' + ${project.progress} + '%'"
                                             th:text="${project.progress} + '%'"></div>
                                    </div>
                                </td>
                                <td>
                                    <span th:switch="${project.status}" class="badge">
                                        <span th:case="'PLANNING'" class="badge bg-secondary">Планирование</span>
                                        <span th:case="'IN_PROGRESS'" class="badge bg-primary">В работе</span>
                                        <span th:case="'COMPLETED'" class="badge bg-success">Завершен</span>
                                        <span th:case="'CANCELLED'" class="badge bg-danger">Отменен</span>
                                        <span th:case="'ON_HOLD'" class="badge bg-warning">Приостановлен</span>
                                    </span>
                                </td>
                                <td>
                                    <span th:switch="${project.priority}" class="badge">
                                        <span th:case="'LOW'" class="badge bg-info">Низкий</span>
                                        <span th:case="'MEDIUM'" class="badge bg-warning">Средний</span>
                                        <span th:case="'HIGH'" class="badge bg-danger">Высокий</span>
                                        <span th:case="'CRITICAL'" class="badge bg-dark">Критический</span>
                                    </span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/projects/{id}(id=${project.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/projects/{id}/edit(id=${project.id})}" 
                                           class="btn btn-sm btn-outline-warning">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/projects/{id}/delete(id=${project.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              onsubmit="return confirm('Вы уверены, что хотите удалить этот проект?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
