<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Вход в систему</title>
</head>
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-header text-center">
                        <h3 class="mb-0">
                            <i class="fas fa-sign-in-alt"></i> Вход в систему
                        </h3>
                    </div>
                    <div class="card-body">
                        <!-- Сообщения об ошибках -->
                        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>
                        
                        <!-- Сообщения об успехе -->
                        <div th:if="${successMessage}" class="alert alert-success" role="alert">
                            <i class="fas fa-check-circle"></i>
                            <span th:text="${successMessage}"></span>
                        </div>
                        
                        <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">
                            <!-- Логин -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user-circle"></i> Логин *
                                </label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       th:field="*{username}"
                                       placeholder="Введите логин"
                                       required>
                                <div th:if="${#fields.hasErrors('username')}" class="text-danger">
                                    <small th:errors="*{username}"></small>
                                </div>
                            </div>
                            
                            <!-- Пароль -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock"></i> Пароль *
                                </label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       th:field="*{password}"
                                       placeholder="Введите пароль"
                                       required>
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                                    <small th:errors="*{password}"></small>
                                </div>
                            </div>
                            
                            <!-- Кнопка входа -->
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-sign-in-alt"></i> Войти
                                </button>
                            </div>
                            
                            <!-- Ссылка на регистрацию -->
                            <div class="text-center">
                                <p class="mb-0">
                                    Нет аккаунта? 
                                    <a href="/auth/register" class="text-decoration-none">
                                        <i class="fas fa-user-plus"></i> Зарегистрироваться
                                    </a>
                                </p>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <small class="text-muted">
                            Добро пожаловать в систему управления!
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
