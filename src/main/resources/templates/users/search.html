<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Поиск пользователей</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">
                <i class="fas fa-search"></i> Поиск пользователей
            </h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/users" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> Назад к списку
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Критерии поиска</h5>
            </div>
            <div class="card-body">
                <form method="get" action="/users/search">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="firstName" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" 
                                       th:value="${param.firstName}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="lastName" class="form-label">Фамилия</label>
                                <input type="text" class="form-control" id="lastName" name="lastName" 
                                       th:value="${param.lastName}">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       th:value="${param.email}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="departmentId" class="form-label">Отдел</label>
                                <select class="form-select" id="departmentId" name="departmentId">
                                    <option value="">Выберите отдел</option>
                                    <option th:each="dept : ${departments}" 
                                            th:value="${dept.id}" 
                                            th:text="${dept.name}"
                                            th:selected="${param.departmentId != null && param.departmentId[0] == dept.id.toString()}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="roleId" class="form-label">Роль</label>
                                <select class="form-select" id="roleId" name="roleId">
                                    <option value="">Выберите роль</option>
                                    <option th:each="role : ${roles}" 
                                            th:value="${role.id}" 
                                            th:text="${role.name}"
                                            th:selected="${param.roleId != null && param.roleId[0] == role.id.toString()}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="projectId" class="form-label">Проект</label>
                                <select class="form-select" id="projectId" name="projectId">
                                    <option value="">Выберите проект</option>
                                    <option th:each="project : ${projects}" 
                                            th:value="${project.id}" 
                                            th:text="${project.name}"
                                            th:selected="${param.projectId != null && param.projectId[0] == project.id.toString()}"></option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search"></i> Поиск
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mt-3" th:if="${users != null}">
            <div class="card-header">
                <h5 class="card-title mb-0">Результаты поиска</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Имя</th>
                                <th>Фамилия</th>
                                <th>Email</th>
                                <th>Телефон</th>
                                <th>Отдел</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.firstName}"></td>
                                <td th:text="${user.lastName}"></td>
                                <td th:text="${user.email}"></td>
                                <td th:text="${user.phone}"></td>
                                <td>
                                    <span th:if="${user.department}" 
                                          th:text="${user.department.name}" 
                                          class="badge bg-primary"></span>
                                    <span th:unless="${user.department}" 
                                          class="text-muted">Не назначен</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/users/{id}(id=${user.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/users/{id}/edit(id=${user.id})}" 
                                           class="btn btn-sm btn-outline-warning">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
