<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Роли</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">
                <i class="fas fa-user-tag"></i> Роли
            </h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/roles/create" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Добавить роль
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="row">
                    <div class="col-md-6">
                        <h5 class="card-title mb-0">Список ролей</h5>
                    </div>
                    <div class="col-md-6 text-end">
                        <a href="/roles/search" class="btn btn-outline-secondary">
                            <i class="fas fa-search"></i> Поиск
                        </a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Название</th>
                                <th>Код</th>
                                <th>Описание</th>
                                <th>Уровень доступа</th>
                                <th>Тип</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="role : ${roles}">
                                <td th:text="${role.id}"></td>
                                <td th:text="${role.name}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${role.code}"></span>
                                </td>
                                <td>
                                    <span th:text="${#strings.abbreviate(role.description, 50)}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-info" th:text="${role.accessLevel}"></span>
                                </td>
                                <td>
                                    <span th:if="${role.isSystem}" class="badge bg-warning">Системная</span>
                                    <span th:unless="${role.isSystem}" class="badge bg-primary">Пользовательская</span>
                                </td>
                                <td>
                                    <span th:if="${role.isActive}" class="badge bg-success">Активна</span>
                                    <span th:unless="${role.isActive}" class="badge bg-danger">Неактивна</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/roles/{id}(id=${role.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/roles/{id}/edit(id=${role.id})}" 
                                           class="btn btn-sm btn-outline-warning">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/roles/{id}/delete(id=${role.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              onsubmit="return confirm('Вы уверены, что хотите удалить эту роль?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
