<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Профили</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">
                <i class="fas fa-user-circle"></i> Профили
            </h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a href="/profiles/create" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Добавить профиль
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="row">
                    <div class="col-md-6">
                        <h5 class="card-title mb-0">Список профилей</h5>
                    </div>
                    <div class="col-md-6 text-end">
                        <a href="/profiles/search" class="btn btn-outline-secondary">
                            <i class="fas fa-search"></i> Поиск
                        </a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Пользователь</th>
                                <th>Адрес</th>
                                <th>Город</th>
                                <th>Страна</th>
                                <th>Почтовый индекс</th>
                                <th>Дата создания</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="profile : ${profiles}">
                                <td th:text="${profile.id}"></td>
                                <td>
                                    <span th:if="${profile.user}" 
                                          th:text="${profile.user.firstName + ' ' + profile.user.lastName}"></span>
                                    <span th:unless="${profile.user}" class="text-muted">Не назначен</span>
                                </td>
                                <td th:text="${profile.address}"></td>
                                <td th:text="${profile.city}"></td>
                                <td th:text="${profile.country}"></td>
                                <td th:text="${profile.postalCode != null ? profile.postalCode : 'Не указан'}"></td>
                                <td th:text="${#temporals.format(profile.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{/profiles/{id}(id=${profile.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/profiles/{id}/edit(id=${profile.id})}" 
                                           class="btn btn-sm btn-outline-warning">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/profiles/{id}/delete(id=${profile.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              onsubmit="return confirm('Вы уверены, что хотите удалить этот профиль?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                <i class="fas fa-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
